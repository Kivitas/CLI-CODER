name: Feature request
description: Suggest an idea or a new command
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the workflow you want to improve.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: For a new command, include a suggested name and what it should do.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have considered
  - type: checkboxes
    id: scope
    attributes:
      label: Checklist
      options:
        - label: I searched the existing issues and this is not a duplicate.
          required: true
        - label: The idea fits the goal of a small, dependency-light terminal tool.
          required: true
